name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Verify installation
      run: |
        python -c "import trackviz; print('trackviz imported successfully')"
        python -c "from trackviz.static import trajectory_2d, trajectory_3d"
        python -c "from trackviz.animate import TrackAnimation2d, TrackAnimation3d"

    - name: Check code syntax
      run: |
        python -m py_compile trackviz/*.py
        python -m py_compile examples/*.py

  build-conda:
    name: Build Conda Package
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: "3.11"
        channels: conda-forge,defaults
        channel-priority: true

    - name: Install conda-build
      shell: bash -el {0}
      run: |
        conda install -y conda-build anaconda-client

    - name: Build conda package
      shell: bash -el {0}
      run: |
        conda build ./conda

    - name: Get package path
      shell: bash -el {0}
      id: conda-package
      run: |
        PKG_PATH=$(conda build ./conda --output)
        echo "package_path=$PKG_PATH" >> $GITHUB_OUTPUT
        echo "Package built at: $PKG_PATH"
